<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTT Platform — приложение поездки под вашим брендом</title>
<meta name="description" content="Приложение деловой поездки под брендом организатора: программа из Excel, Word или PDF, участники, код приглашения и QR.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231a73e8'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='10' cy='22' r='2.6'/%3E%3Ccircle cx='22' cy='10' r='2.6'/%3E%3Cpath d='M12.6 22H19a3.5 3.5 0 0 0 0-7h-6a3.5 3.5 0 0 1 0-7h6.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<!-- Макет лендинга платформы (решение пользователя 21.10.2026: «собрать макет лендинга… с тарифами — тарифы придумаем позже»).
     Тексты на шести языках — словарь T внизу; язык и тема общие с приложением (localStorage gtt:pref:lang / gtt:pref:theme). -->
<style>
:root {
  --bg: #e8edf4; --card: #eef2f8; --surface: #ffffff; --ink: #0f1b2d; --muted: #5b6576; --line: #d6dde8; --well: #e3e9f2;
  --shade: #cdd5e1; --glow: #ffffff;
  --accent: #1a73e8; --accent2: #0f4fc0; --accentSoft: #dde8fb; --accentInk: #1558b8;
  --ok: #1e6b45; --okSoft: #dcf1e4; --warn: #a2470a; --warnSoft: #fdeadb; --violet: #7048e8; --orange: #e8590c; --green: #1e8e5a;
  --mark: #fff1c2; --markInk: #6b4e00; --onAccent: #ffffff;
  --head: rgba(232, 237, 244, .82);
  --fb: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fd: 'Sofia Sans Extra Condensed', 'Arial Narrow', 'Inter', sans-serif;
  --hs: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a23; --card: #1b2330; --surface: #222c3b; --ink: #e9eef6; --muted: #9aa5b6; --line: #2b3546; --well: #121822;
    --shade: #0a0e14; --glow: #232d3c;
    --accent: #4c94f5; --accent2: #1a5fd0; --accentSoft: #1d3352; --accentInk: #8fbaf8;
    --ok: #6fd59f; --okSoft: #16372a; --warn: #ffb27a; --warnSoft: #3a2617; --violet: #9b84ff; --orange: #ff9a5c; --green: #4cc38a;
    --mark: #3d3212; --markInk: #ffd98a; --onAccent: #ffffff;
    --head: rgba(20, 26, 35, .82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a23; --card: #1b2330; --surface: #222c3b; --ink: #e9eef6; --muted: #9aa5b6; --line: #2b3546; --well: #121822;
  --shade: #0a0e14; --glow: #232d3c;
  --accent: #4c94f5; --accent2: #1a5fd0; --accentSoft: #1d3352; --accentInk: #8fbaf8;
  --ok: #6fd59f; --okSoft: #16372a; --warn: #ffb27a; --warnSoft: #3a2617; --violet: #9b84ff; --orange: #ff9a5c; --green: #4cc38a;
  --mark: #3d3212; --markInk: #ffd98a; --onAccent: #ffffff;
  --head: rgba(20, 26, 35, .82);
  color-scheme: dark;
}
:root[lang="zh"] { --fb: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif; --fd: 'Noto Sans SC', 'PingFang SC', sans-serif; --hs: .74; }
:root[lang="ar"] { --fb: 'Noto Sans Arabic', 'Inter', sans-serif; --fd: 'Noto Sans Arabic', sans-serif; --hs: .7; }
:root[lang="hi"] { --fb: 'Noto Sans Devanagari', 'Inter', sans-serif; --fd: 'Noto Sans Devanagari', sans-serif; --hs: .7; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--fb); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--fd); margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h2 { font-size: calc(clamp(38px, 5vw, 60px) * var(--hs)); font-weight: 800; line-height: .98; }
h3 { font-family: var(--fb); font-size: 18px; font-weight: 700; line-height: 1.3; }
p { margin: 0; }
em.acc { font-style: normal; color: var(--accent); }
mark { background: var(--mark); color: var(--markInk); border-radius: 6px; padding: 0 .3em; font-weight: 600; }
.muted { color: var(--muted); }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accentInk); }
:root[lang="ar"] .kicker, :root[lang="hi"] .kicker, :root[lang="zh"] .kicker { letter-spacing: 0; }
.clay { background: var(--card); border-radius: 26px; box-shadow: 8px 8px 18px var(--shade), -8px -8px 18px var(--glow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 18px; border: 0; cursor: pointer;
  font: 600 16px/1 var(--fb); text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { color: var(--onAccent); background: linear-gradient(160deg, var(--accent), var(--accent2));
  box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 35%, transparent), inset -2px -3px 6px rgba(0,0,0,.14), inset 2px 2px 5px rgba(255,255,255,.25); }
.btn.soft { color: var(--ink); background: var(--card); box-shadow: 5px 5px 12px var(--shade), -5px -5px 12px var(--glow); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .dot:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.arr { display: inline-block; }
[dir="rtl"] .arr { transform: scaleX(-1); }
section { padding-block: clamp(56px, 9vw, 104px); }
.sec-head { display: grid; gap: 14px; max-width: 760px; margin-bottom: 40px; }
.sec-head p { color: var(--muted); font-size: 18px; max-width: 62ch; }

/* полоса «макет» */
.notice { background: var(--warnSoft); color: var(--warn); font-size: 14px; font-weight: 500; }
.notice .wrap { display: flex; align-items: center; gap: 10px; padding-block: 9px; }
.notice b { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* шапка */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--head); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
header .wrap { display: flex; align-items: center; gap: 22px; min-height: 72px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 26px/1 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif; letter-spacing: .01em; white-space: nowrap; }
.logo i { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(150deg, var(--accent), var(--accent2)); box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.logo i svg { width: 22px; height: 22px; stroke-width: 2.2; }
nav { display: flex; gap: 22px; margin-inline-start: 8px; }
nav a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
nav a:hover { color: var(--ink); }
.tools { display: flex; align-items: center; gap: 10px; margin-inline-start: auto; }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel svg { position: absolute; inset-inline-start: 12px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
select { appearance: none; -webkit-appearance: none; height: 44px; padding-inline: 38px 14px; border: 0; border-radius: 14px; background: var(--card); color: var(--ink);
  font: 500 15px var(--fb); cursor: pointer; box-shadow: inset 3px 3px 6px var(--shade), inset -3px -3px 6px var(--glow); }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 0; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: var(--card);
  box-shadow: 4px 4px 10px var(--shade), -4px -4px 10px var(--glow); }
.iconbtn .moon { display: none; }
:root[data-dark="1"] .iconbtn .sun { display: none; }
:root[data-dark="1"] .iconbtn .moon { display: block; }
header .btn { min-height: 44px; padding: 0 18px; font-size: 15px; border-radius: 14px; }
@media (max-width: 980px) { nav { display: none; } }
@media (max-width: 600px) { header .btn { display: none; } .logo span { font-size: 22px; } }

/* первый экран */
.hero { padding-block: clamp(36px, 6vw, 72px) clamp(56px, 8vw, 96px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: clamp(32px, 5vw, 64px); align-items: center; }
.hero-text { display: grid; gap: 24px; min-width: 0; }
.hero h1 { font-size: calc(clamp(50px, 7.6vw, 98px) * var(--hs)); font-weight: 800; line-height: .92; }
:root[lang="zh"] .hero h1, :root[lang="ar"] .hero h1, :root[lang="hi"] .hero h1 { font-weight: 700; line-height: 1.18; }
:root[lang="zh"] h2, :root[lang="ar"] h2, :root[lang="hi"] h2 { font-weight: 700; line-height: 1.25; }
.lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 56ch; }
.cta-row { display: flex; flex-wrap: wrap; gap: 14px; }
.works { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; }
.works span.devs { display: inline-flex; gap: 4px; color: var(--accentInk); }
.works svg { width: 20px; height: 20px; }
.stage { display: grid; justify-items: center; gap: 22px; min-width: 0; }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); } }

/* телефон */
.phone { --pb: #1a73e8; width: min(312px, 100%); aspect-ratio: 312 / 632; max-width: 100%; border-radius: 48px; padding: 12px; background: var(--card);
  box-shadow: 14px 18px 36px var(--shade), -10px -10px 26px var(--glow), inset 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); }
.screen { position: relative; height: 100%; border-radius: 37px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.35; }
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px 4px; font-weight: 600; font-size: 12px; }
.sbar .isl { width: 86px; height: 24px; border-radius: 14px; background: #0b1017; }
.ph-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; }
.ph-logo { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--pb), color-mix(in srgb, var(--pb) 62%, #000)); flex: none; }
.ph-logo svg { width: 19px; height: 19px; stroke-width: 2.3; }
.ph-head b { display: block; font-size: 14px; }
.ph-head small { color: var(--muted); font-size: 11.5px; }
.scr { flex: 1; overflow: hidden; padding: 4px 14px 0; display: grid; gap: 10px; align-content: start; }
.now { border-radius: 20px; padding: 14px; color: #fff; background: linear-gradient(155deg, color-mix(in srgb, var(--pb) 88%, #fff), color-mix(in srgb, var(--pb) 62%, #000));
  box-shadow: 0 12px 24px color-mix(in srgb, var(--pb) 32%, transparent); display: grid; gap: 4px; }
.now .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.now .t { font: 800 30px/1 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif; }
.now b { font-size: 14.5px; }
.now span { opacity: .85; }
.mini { background: var(--card); border-radius: 18px; padding: 12px; box-shadow: 4px 4px 10px var(--shade), -4px -4px 10px var(--glow); display: grid; gap: 8px; }
.mini .h { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.row .tm { font-weight: 700; width: 40px; flex: none; }
.row .k { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.call { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 16px; background: var(--card); box-shadow: 4px 4px 10px var(--shade), -4px -4px 10px var(--glow); font-weight: 600; }
.call i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--green); }
.call svg { width: 15px; height: 15px; }
.day { background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: 4px 4px 10px var(--shade), -4px -4px 10px var(--glow); }
.day b { display: block; color: color-mix(in srgb, var(--pb) 80%, var(--ink)); }
.day span { color: var(--muted); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; flex: none; }
.person { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); box-shadow: 3px 3px 8px var(--shade), -3px -3px 8px var(--glow); }
.person b { display: block; }
.person span span { color: var(--muted); font-size: 11.5px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 16px; background: var(--card); box-shadow: 3px 3px 8px var(--shade), -3px -3px 8px var(--glow); }
.msg small { display: block; font-weight: 700; color: color-mix(in srgb, var(--pb) 80%, var(--ink)); font-size: 10.5px; }
.msg.me { justify-self: end; background: var(--pb); color: #fff; box-shadow: none; border-end-end-radius: 6px; }
.msg:not(.me) { border-end-start-radius: 6px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin: 10px; padding: 6px; border-radius: 22px; background: var(--surface); box-shadow: 0 8px 20px color-mix(in srgb, var(--shade) 80%, transparent); }
.tab { border: 0; background: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 16px; cursor: pointer; font: 600 10.5px var(--fb); }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { color: var(--pb); background: color-mix(in srgb, var(--pb) 12%, transparent); }
.under { display: grid; justify-items: center; gap: 10px; text-align: center; }
.dots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: 3px 3px 8px var(--shade), -3px -3px 8px var(--glow); }
.dot[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor; }
.under small { color: var(--muted); font-size: 14px; }

/* для кого / возможности */
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.card { padding: 26px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card p { color: var(--muted); }
.ico { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; color: var(--accentInk); background: var(--accentSoft); }
.ico svg { width: 24px; height: 24px; }

/* шаги */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; counter-reset: s; }
.step { padding: 26px; display: grid; gap: 10px; align-content: start; position: relative; }
.step .n { font: 800 64px/0.85 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif; color: var(--accent); }
.step p { color: var(--muted); }
.steps-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; margin-top: 30px; }
@media (max-width: 980px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } }

/* загрузка программы */
.imp { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 60px); align-items: center; }
.imp-text { display: grid; gap: 22px; min-width: 0; }
.imp-text > p { color: var(--muted); font-size: 18px; }
.files { display: flex; flex-wrap: wrap; gap: 12px; }
.file { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border-radius: 16px; background: var(--card); font-weight: 600;
  box-shadow: 4px 4px 10px var(--shade), -4px -4px 10px var(--glow); }
.file i { font: 700 11px/1 var(--fb); font-style: normal; color: #fff; padding: 7px 6px; border-radius: 8px; letter-spacing: .02em; }
.imp-note { font-size: 14px; color: var(--muted); }
.conv { display: grid; grid-template-columns: minmax(0, .9fr) auto minmax(0, 1.15fr); gap: 14px; align-items: center; }
.doc { padding: 18px; border-radius: 22px; background: var(--surface); box-shadow: 8px 8px 18px var(--shade), -8px -8px 18px var(--glow); display: grid; gap: 7px; font-size: 14px; min-width: 0; }
.doc .fn { display: flex; align-items: center; gap: 8px; font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.doc .fn i { font: 700 10px/1 var(--fb); font-style: normal; color: #fff; background: #2b5797; padding: 5px; border-radius: 6px; }
.doc p { overflow-wrap: break-word; }
.doc p.dh { font-weight: 700; margin-top: 4px; }
.flow { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--accent), var(--accent2)); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.parsed { padding: 16px; display: grid; gap: 8px; min-width: 0; font-size: 14px; }
.parsed .dh { font-weight: 700; color: var(--accentInk); margin-top: 2px; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--well);
  box-shadow: inset 2px 2px 5px var(--shade), inset -2px -2px 5px var(--glow); }
.ev b { font-variant-numeric: tabular-nums; }
.ev span { overflow-wrap: break-word; min-width: 0; }
.kind { font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.okline { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-weight: 600; color: var(--ok); background: var(--okSoft); padding: 8px 12px; border-radius: 12px; justify-self: start; }
.okline svg { width: 18px; height: 18px; }
@media (max-width: 980px) { .imp { grid-template-columns: minmax(0, 1fr); } }
[dir="rtl"] .flow svg { transform: scaleX(-1); }
/* на телефоне стрелка смотрит вниз — и при письме справа налево тоже */
@media (max-width: 620px) { .conv { grid-template-columns: minmax(0, 1fr); } .flow { justify-self: center; transform: rotate(90deg); } [dir="rtl"] .flow svg { transform: none; } }

/* устройства */
.devices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.dev { padding: 26px; display: grid; gap: 12px; align-content: start; }
.dev .shape { height: 120px; display: grid; place-items: end center; margin-bottom: 6px; }
.dev .shape div { background: var(--well); border-radius: 12px; box-shadow: inset 3px 3px 7px var(--shade), inset -3px -3px 7px var(--glow); display: grid; gap: 6px; padding: 10px; align-content: start; }
.dev .shape span { display: block; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.dev .shape span.a { background: var(--accent); width: 60%; }
.dev p { color: var(--muted); }
@media (max-width: 860px) { .devices { grid-template-columns: minmax(0, 1fr); } }

/* тарифы */
.plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
.plan { padding: 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.plan .stamp { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border: 1.5px dashed var(--line); padding: 4px 8px; border-radius: 8px; }
.plan h3 { font: 800 calc(34px * var(--hs) + 6px * (1 - var(--hs)))/1 var(--fd); }
.plan .for { color: var(--muted); min-height: 3em; }

const LANGS = Object.keys(T);
const PALETTE = ['#1a73e8', '#0f8a6c', '#7048e8', '#c2255c', '#e8590c', '#0c8599', '#2b2f3a', '#b08900'];
const root = document.documentElement;
const pref = {
  get(k) { try { return localStorage.getItem('gtt:pref:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('gtt:pref:' + k, v); } catch { /* без хранилища — до перезагрузки */ } },
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// *акцент* — цветом бренда, [уточнить …] — жёлтой плашкой: заглушки должны быть видны
const fmt = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em class="acc">$1</em>').replace(/\[([^\]]+)\]/g, '<mark>$1</mark>');

function setLang(l) {
  const d = T[l] || T.ru;
  root.lang = l;
  root.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = d.title;
  document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = fmt(d[el.dataset.i] ?? T.ru[el.dataset.i] ?? ''); });
  document.querySelectorAll('[data-i-aria]').forEach((el) => el.setAttribute('aria-label', d[el.dataset.iAria]));
  // в распознанной программе — те же строки без времени
  document.querySelectorAll('[data-x]').forEach((el) => { el.textContent = d[el.dataset.x].replace(/^\d{1,2}:\d{2}\s*/, ''); });
  document.getElementById('lang').value = l;
}
const saved = pref.get('lang');
const nav = (navigator.languages || [navigator.language || 'ru']).map((x) => String(x).slice(0, 2)).find((x) => LANGS.includes(x));
setLang(LANGS.includes(saved) ? saved : nav || 'ru');
// выбор на лендинге — общий с приложением: кабинет откроется на этом же языке
document.getElementById('lang').addEventListener('change', (e) => { setLang(e.target.value); pref.set('lang', e.target.value); });

const mq = matchMedia('(prefers-color-scheme: dark)');
function paintTheme() {
  const t = root.dataset.theme;
  root.dataset.dark = (t ? t === 'dark' : mq.matches) ? '1' : '0';
}
const th = pref.get('theme');
if (th === 'light' || th === 'dark') root.dataset.theme = th;
paintTheme();
mq.addEventListener?.('change', paintTheme);
document.getElementById('theme').addEventListener('click', () => {
  const next = root.dataset.dark === '1' ? 'light' : 'dark';
  root.dataset.theme = next;
  pref.set('theme', next);
  paintTheme();
});

const phone = document.getElementById('phone');
phone.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  phone.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  phone.querySelectorAll('.scr').forEach((s) => { s.hidden = s.dataset.s !== b.dataset.tab; });
}));
const dots = document.getElementById('dots');
PALETTE.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.type = 'button'; b.style.background = c; b.style.color = c;
  b.setAttribute('aria-label', c); b.setAttribute('aria-pressed', String(i === 0));
  b.addEventListener('click', () => {
    phone.style.setProperty('--pb', c);
    dots.querySelectorAll('.dot').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  dots.appendChild(b);
});
