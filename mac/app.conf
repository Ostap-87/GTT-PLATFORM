# Приложение для Mac (mac/install_mac.command): название, окно, адрес встроенного сервера.
# Платформенный файл: при слиянии из GTT-APP остаётся этим (как mobile/app.json), иконка тоже.
NAME="GTT Platform"                # в «Программах», на рабочем столе и в Dock
TITLE="GTT Platform — кабинет организатора"
BUNDLE_ID="ru.globaltechtour.platform"
REPO="Ostap-87/GTT-PLATFORM"
PORT=8732                          # постоянный: данные кабинета привязаны к адресу
START="/org"                       # сразу кабинет; приложение участника — из кабинета
WIDTH=1360
HEIGHT=900
MIN_WIDTH=900
MIN_HEIGHT=640
