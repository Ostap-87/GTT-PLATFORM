name: Сборка для Mac

# Веб-сборка приложения в ветке mac-dist (перезаписывается каждой сборкой): web/ (expo export),
# install_mac.command, gtt_window.py, app.conf, AppIcon.icns. Пользователь скачивает её архивом с
# codeload.github.com (raw.githubusercontent.com в части сетей России закрыт).
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Зависимости
        working-directory: mobile
        run: npm ci

      - name: Веб-сборка
        working-directory: mobile
        run: npx expo export --platform web

      - name: Совместимость со старыми Mac (движок Safari 13+)
        working-directory: mobile/dist
        run: |
          # код приложения — в синтаксис ES2019 (на macOS 11–13 встроенный движок не понимает ??=, ?. и т. п.),
          # первым скриптом — mac/compat.js: недостающие функции и текст ошибки вместо белого экрана
          npx --yes esbuild@0.24.0 _expo/static/js/web/*.js --outdir=_expo/static/js/web --allow-overwrite \
            --target=es2019,safari13 --charset=utf8 --minify-whitespace --log-level=warning
          cp ../../mac/compat.js compat.js
          python3 - <<'PY'
          s = open("index.html", encoding="utf-8").read()
          i = s.index("<script")
          open("index.html", "w", encoding="utf-8").write(s[:i] + '<script src="/compat.js"></script>' + s[i:])
          PY
          for f in compat.js _expo/static/js/web/*.js; do npx --yes acorn@8.14.0 --ecma2019 --silent "$f"; done

      - name: Ветка mac-dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pack
          cp -R mobile/dist pack/web
          cp mac/install_mac.command mac/gtt_window.py mac/app.conf mac/AppIcon.icns pack/
          cd pack
          git init -q -b mac-dist
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Сборка для Mac из ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" mac-dist
          {
            echo "### Сборка для Mac готова (ветка mac-dist)"
            echo "Установить или обновить на Mac — в Терминале:"
            echo '```'
            echo "D=\$(mktemp -d) && curl -fL https://codeload.github.com/${{ github.repository }}/tar.gz/refs/heads/mac-dist | tar -xzf - -C \"\$D\" --strip-components=1 && bash \"\$D/install_mac.command\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
